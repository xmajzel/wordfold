# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@0.37.0/schema/sync_rules.json

config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - |
        SELECT id, user_id, name, color, created_at, updated_at, deleted_at
        FROM collections
        WHERE user_id = auth.user_id()
      - |
        SELECT id, user_id, collection_id, term, normalized_term,
               source_language_code, target_language_code, part_of_speech,
               definition, example, translation, catalog_sense_id, cefr_level,
               source, state, understood_streak, lapse_count, view_count,
               last_viewed_at, last_rated_at, next_review_at,
               created_at, updated_at, deleted_at
        FROM words
        WHERE user_id = auth.user_id()
      - |
        SELECT id, user_id, word_id, type, value, occurred_at
        FROM learning_events
        WHERE user_id = auth.user_id()
