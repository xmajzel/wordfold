plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wordfoldtranslate'
version = '0.1.0'

android {
  namespace "expo.modules.wordfoldtranslate"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.mlkit:translate:17.0.3'
}
